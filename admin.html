<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tableau de bord — Mont Ventoux Online</title>
  <link rel="icon" type="image/png" href="img/icone.png">
  <link rel="stylesheet" href="style.css?v=11">
  <style>
    .admin { padding: 40px 0 80px; }
    .admin .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .admin input, .admin select { font: inherit; color: var(--text); background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .admin button { font: inherit; font-weight: 700; color: #fff; background: var(--red); border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; }
    .admin button.ghost { background: var(--bg-3); }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 10px 0 24px; }
    .kpis div { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .kpis strong { display: block; font-size: 28px; color: var(--red); }
    .kpis span { color: var(--muted); font-size: 13px; }
    @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .msg { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .msg.unread { border-color: var(--red); }
    .msg header { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
    .msg h3 { margin: 6px 0; font-size: 18px; }
    .msg p { margin: 6px 0; white-space: pre-wrap; }
    .msg .det { color: var(--muted); font-size: 14px; }
    .bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
    .bars div { flex: 1; background: var(--red); border-radius: 3px 3px 0 0; min-height: 2px; }
    .err { color: #ff8a8d; font-weight: 700; }
  </style>
</head>
<body>
<section class="admin">
  <div class="wrap">
    <div class="kicker">Mont Ventoux Online</div>
    <h2>Tableau de bord</h2>
    <p class="lead">Page privée (non référencée) : joueurs, abonnements et messages du formulaire de contact. Le jeton d'administration reste dans ce navigateur.</p>
    <div class="row">
      <input id="token" type="password" placeholder="Jeton d'administration (ADMIN_TOKEN)" size="40" autocomplete="off">
      <button id="go">Afficher</button>
      <button id="forget" class="ghost">Oublier le jeton</button>
      <span id="state"></span>
    </div>

    <div id="dash" hidden>
      <h3>Joueurs</h3>
      <div class="kpis" id="kpis"></div>
      <div class="bars" id="bars" title="Joueurs par jour, 30 derniers jours"></div>
      <p id="subs" style="color: var(--muted)"></p>

      <h3 style="margin-top: 34px">Messages du formulaire</h3>
      <div class="row">
        <select id="rub"><option value="">Toutes les rubriques</option><option value="avant_achat">Question avant achat</option>
          <option value="technique">Problème technique</option><option value="abonnement">Abonnement / paiement</option>
          <option value="idee">Idée ou retour de test</option></select>
        <label><input type="checkbox" id="unread"> Non lus seulement</label>
        <button id="reload" class="ghost">Actualiser</button>
      </div>
      <p id="counts" style="color: var(--muted)"></p>
      <div id="msgs"></div>
    </div>
  </div>
</section>
<script>
(function () {
  var API = "https://mvo-abonnement.montventouxonline.workers.dev";
  var LABEL = { avant_achat: "Question avant achat", technique: "Problème technique", abonnement: "Abonnement / paiement", idee: "Idée ou retour de test" };
  var $ = function (id) { return document.getElementById(id); };
  var token = "";
  try { token = localStorage.getItem("mvo_admin") || ""; } catch (e) {}
  $("token").value = token;
  var esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  function call(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: "Bearer " + token }, opts.headers || {});
    return fetch(API + path, opts).then(function (r) {
      if (r.status === 401) throw new Error("Jeton refusé");
      return r.json();
    });
  }
  function stats() {
    return call("/v1/stats").then(function (s) {
      $("kpis").innerHTML = [["Aujourd'hui", s.joueurs_aujourdhui], ["7 jours", s.joueurs_7_jours], ["30 jours", s.joueurs_30_jours], ["Ordinateurs", s.appareils_total]]
        .map(function (k) { return '<div><strong>' + k[1] + '</strong><span>' + k[0] + '</span></div>'; }).join("");
      var max = Math.max.apply(null, s.par_jour.map(function (d) { return d.joueurs; }).concat([1]));
      $("bars").innerHTML = s.par_jour.map(function (d) {
        return '<div style="height:' + (d.joueurs / max * 100).toFixed(0) + '%" title="' + d.jour + ' : ' + d.joueurs + ' joueurs, ' + (d.abonnes || 0) + ' abonnés"></div>';
      }).join("");
      $("subs").textContent = "Abonnements : " + (s.abonnements.map(function (a) { return a.statut + (a.test ? " (test)" : "") + " " + a.n; }).join(" · ") || "aucun") +
        " — Versions (30 j) : " + (s.versions.map(function (v) { return (v.version || "?") + " × " + v.n; }).join(", ") || "—");
    });
  }
  function messages() {
    var q = "?" + ($("rub").value ? "rubrique=" + $("rub").value + "&" : "") + ($("unread").checked ? "non_lus=1" : "");
    return call("/v1/admin/messages" + q).then(function (r) {
      $("counts").textContent = r.par_rubrique.map(function (x) { return (LABEL[x.rubrique] || x.rubrique) + " : " + x.n + " (" + x.non_lus + " non lus)"; }).join(" · ") || "Aucun message pour l'instant.";
      $("msgs").innerHTML = r.messages.map(function (m) {
        return '<article class="msg' + (m.lu ? "" : " unread") + '"><header><span>' + esc(LABEL[m.rubrique] || m.rubrique) + " · " + esc(m.recu_le.replace("T", " ").slice(0, 16)) +
          " · " + esc(m.langue || "fr") + '</span><span><a href="mailto:' + esc(m.email) + "?subject=" + encodeURIComponent("Re : " + m.sujet) + '">' + esc(m.nom) + " &lt;" + esc(m.email) + "&gt;</a></span></header>" +
          "<h3>" + esc(m.sujet) + "</h3><p>" + esc(m.message) + "</p>" + (m.details ? '<p class="det">' + esc(m.details) + "</p>" : "") +
          '<button class="ghost" data-id="' + m.id + '" data-lu="' + (m.lu ? 0 : 1) + '">' + (m.lu ? "Marquer non lu" : "Marquer lu") + "</button></article>";
      }).join("");
    });
  }
  function load() {
    token = $("token").value.trim();
    try { localStorage.setItem("mvo_admin", token); } catch (e) {}
    $("state").textContent = "Chargement…"; $("state").className = "";
    Promise.all([stats(), messages()]).then(function () { $("dash").hidden = false; $("state").textContent = ""; })
      .catch(function (e) { $("dash").hidden = true; $("state").textContent = e.message || "Erreur"; $("state").className = "err"; });
  }
  $("go").addEventListener("click", load);
  $("reload").addEventListener("click", messages);
  $("rub").addEventListener("change", messages);
  $("unread").addEventListener("change", messages);
  $("forget").addEventListener("click", function () { try { localStorage.removeItem("mvo_admin"); } catch (e) {} $("token").value = ""; $("dash").hidden = true; });
  $("msgs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-id]");
    if (!b) return;
    call("/v1/admin/lu", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: +b.getAttribute("data-id"), lu: b.getAttribute("data-lu") === "1" }) }).then(messages);
  });
  if (token) load();
})();
</script>
</body>
</html>
